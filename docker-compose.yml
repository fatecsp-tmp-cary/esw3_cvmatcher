services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cvmatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cvmatch}
      POSTGRES_DB: ${POSTGRES_DB:-cvmatch}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cvmatch} -d ${POSTGRES_DB:-cvmatch}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
