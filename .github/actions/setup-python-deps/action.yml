name: Setup Python deps
description: Install hashed build, development and local CPU inference dependencies. No model downloads.

inputs:
  python-version:
    description: Python version matching the committed lock provenance.
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: requirements/*.lock

    - name: Install locked dependencies
      shell: bash
      run: |
        python scripts/dependencies/inputs.py --check
        python -m pip install --require-hashes -r requirements/build.lock -r requirements/dev.lock
        python -m pip install --require-hashes -r requirements/local-models.lock --extra-index-url https://download.pytorch.org/whl/cpu
        python -m pip install --no-deps --no-build-isolation -e .
        python -m pip check
