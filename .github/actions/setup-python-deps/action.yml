name: Setup Python deps
description: Set up Python and install the project with the dev dependency group. Run after checkout.

inputs:
  python-version:
    description: Python version to install.
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip

    - name: Upgrade pip
      shell: bash
      run: python -m pip install --upgrade pip

    - name: Install dev dependencies
      shell: bash
      run: pip install -e . --group dev
