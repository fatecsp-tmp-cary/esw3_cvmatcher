name: CI

on:
  push:
    branches: [main, dev, staging]
  pull_request:
    branches: [main, dev, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python and dependencies
        uses: ./.github/actions/setup-python-deps

      - name: Lint (ruff check)
        run: ruff check --output-format=github .

      - name: Format check (ruff format)
        run: ruff format --check .

  tests:
    name: Unit and API tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python and dependencies
        uses: ./.github/actions/setup-python-deps

      # Failures show up as inline annotations on the PR diff
      # (pytest-github-actions-annotate-failures) and in the JUnit report.
      - name: Run tests
        run: |
          mkdir -p reports
          pytest -ra \
            -m "not integration and not e2e and not external" \
            --junitxml=reports/junit-tests.xml

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-tests
          path: reports/junit-tests.xml
          if-no-files-found: ignore

  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: cvmatch
          POSTGRES_PASSWORD: cvmatch
          POSTGRES_DB: cvmatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cvmatch -d cvmatch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://cvmatch:cvmatch@localhost:5432/cvmatch_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python and dependencies
        uses: ./.github/actions/setup-python-deps

      - name: Run integration and e2e tests
        run: |
          mkdir -p reports
          # `run:` uses `bash -e`; route pytest's exit code through `||` so it
          # can be inspected. Exit code 5 (no tests collected) is accepted until
          # the first database-backed tests land (#37).
          pytest -ra -m "(integration or e2e) and not external" \
            --junitxml=reports/junit-integration.xml || code=$?
          code=${code:-0}
          if [ "$code" -eq 5 ]; then
            echo "::notice::No integration or e2e tests collected yet."
            exit 0
          fi
          exit "$code"

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-integration
          path: reports/junit-integration.xml
          if-no-files-found: ignore
