name: CI

on:
  push:
    branches: main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

permissions:
  contents: read

jobs:
  locks:
    name: Offline lock consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/dependencies/inputs.py --check
      - run: python -m unittest discover -s scripts/dependencies -p "test_*.py"

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python and dependencies
        uses: ./.github/actions/setup-python-deps

      - name: Lint (ruff check)
        run: ruff check --output-format=github .

      - name: Format check (ruff format)
        run: ruff format --check .

  tests:
    name: Unit and API tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python and dependencies
        uses: ./.github/actions/setup-python-deps

      # Failures show up as inline annotations on the PR diff
      # (pytest-github-actions-annotate-failures) and in the JUnit report.
      - name: Run tests
        run: |
          mkdir -p reports
          pytest -ra \
            -m "not integration and not e2e and not external" \
            --junitxml=reports/junit-tests.xml

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-tests
          path: reports/junit-tests.xml
          if-no-files-found: ignore

  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
        env:
          POSTGRES_USER: cvmatch
          POSTGRES_PASSWORD: cvmatch
          POSTGRES_DB: cvmatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cvmatch -d cvmatch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://cvmatch:cvmatch@localhost:5432/cvmatch_test
      TEST_DATABASE_URL: postgresql://cvmatch:cvmatch@localhost:5432/cvmatch_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python and dependencies
        uses: ./.github/actions/setup-python-deps

      - name: Migration round trip and schema drift
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check

      - name: Run integration and e2e tests
        run: |
          mkdir -p reports
          pytest -ra -m "(integration or e2e) and not external" \
            --junitxml=reports/junit-integration.xml

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-integration
          path: reports/junit-integration.xml
          if-no-files-found: ignore

  types:
    name: Type checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-deps
      - run: mypy

  docker:
    name: Production image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag cvmatcher:ci .
