services:
  mock-api:
    build:
      context: .
      dockerfile: Dockerfile.mock
    ports:
      - "${MOCK_API_PORT:-8001}:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
