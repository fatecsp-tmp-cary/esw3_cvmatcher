[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "esw3-cvmatcher"
version = "0.1.0"
description = "CV-Match: job matching and ranking REST API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "httpx2>=2.13",
    "pytest-github-actions-annotate-failures>=0.4",
]
# Only for scripts/benchmarks; CI installs just `dev`. Install the CPU-only PyTorch first:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
#   pip install -e . --group benchmark
benchmark = [
    "sentence-transformers>=3",
    "psutil>=5.9",
    "numpy>=1.26",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "-m", "not external",
    "--cov=src",
    "--cov-report=term-missing",
]
xfail_strict = true
markers = [
    "unit: fast, isolated tests with no I/O (auto-applied under tests/unit)",
    "integration: tests that use PostgreSQL or other local services (auto-applied under tests/integration)",
    "api: HTTP-level tests through the FastAPI TestClient (auto-applied under tests/api)",
    "e2e: end-to-end pipeline tests (auto-applied under tests/e2e)",
    "external: tests that reach live external sources; deselected by default, never required in CI",
]

[tool.coverage.run]
source = ["src"]
